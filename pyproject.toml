[project]
name = "kproj"
version = "0.10.0"
description = "KiCad project publisher for the SPCoast Hugo site"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "John Plocher" },
]
keywords = ["kicad", "hugo", "static-site", "pcb", "release", "spcoast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
    # jBOM is consumed as a library-only dependency per ADR 0003.  v7.3.0
    # added the title-block ``comments`` mapping + ``ResolvedPcbProject``
    # ``text_variables`` that kproj's KicadProjectReader.read thin-wraps;
    # bumping the pin below 7.3.0 will break the read pipeline.
    "jbom>=7.3.0",
    # Phase 6 will add additional runtime deps as the implementation lands:
    #   "Pillow" (for thumbnail crop, if PNG-render approach wins over SVG-outline)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "behave>=1.2.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
kproj = "kproj.cli.main:main"

[project.urls]
Homepage = "https://github.com/plocher/kproj"
Repository = "https://github.com/plocher/kproj.git"
Issues = "https://github.com/plocher/kproj/issues"

















[tool.uv.sources]
# Local editable path during development — jBOM is the sibling repo on the
# user's machine.  Released kproj wheels will resolve ``jbom`` from PyPI once
# both projects publish there; until then the path source pins us to the
# checked-out tree.
jbom = { path = "../jBOM", editable = true }


[tool.hatch.build.targets.wheel]
packages = ["src/kproj"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/contract"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "contract: external-tool contract tests (kicad-cli / iBOM), skipped when tools missing",
]


[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/", "templates/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "SIM",# flake8-simplify
    "RUF",# ruff-specific
]
ignore = [
    "E501",  # line-length is enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]


[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kproj"]
plugins = []
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
# jBOM does not publish a ``py.typed`` marker; its types resolve to ``Any``.
# This is acceptable for v1: kproj's KicadProjectReader is the only consumer
# and wraps every jBOM call in a kproj-owned dataclass.  Re-evaluate when
# jBOM ships type stubs.
module = "jbom.*"
ignore_missing_imports = true


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/kproj/__init__.py:__version__"]
build_command = "pip install build && python -m build"
dist_glob_patterns = ["dist/*"]
branch = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore(?:\\(.+\\))?: .*",
    "^ci(?:\\(.+\\))?: .*",
    "^docs(?:\\(.+\\))?: .*",
    "^style(?:\\(.+\\))?: .*",
    "^test(?:\\(.+\\))?: .*",
]

[tool.semantic_release.commit_parser_options]
major_tags = ["breaking"]
minor_tags = ["feat", "feature"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
upload_to_pypi = true
upload_to_repository = true
















[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
